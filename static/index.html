<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F&O Board</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #14181f; --muted: #6b7482;
    --up: #0a8f5b; --down: #d1343f; --flat: #6b7482; --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --panel: #161a21; --line: #252b35; --text: #e8ebf0; --muted: #8b94a3;
      --up: #2ecc8f; --down: #ff6b74; --flat: #8b94a3; --accent: #6b9bff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px;
           align-items: center; padding: 10px 16px; background: var(--bg);
           border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 6px 0 0; letter-spacing: -0.01em; }
  input, select { font: inherit; color: var(--text); background: var(--panel);
                  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input { width: 180px; }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  input.num { width: 68px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
          border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
          color: var(--muted); max-width: 100%; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--flat); flex: none; }
  .pill.live .dot { background: var(--up); } .pill.demo .dot { background: var(--accent); }
  .pill.error .dot, .pill.offline .dot { background: var(--down); }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button { font: inherit; color: var(--muted); background: var(--panel); border: 0;
                 padding: 6px 12px; cursor: pointer; }
  .tabs button + button { border-left: 1px solid var(--line); }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .spacer { flex: 1; }
  .counts { color: var(--muted); font-variant-numeric: tabular-nums; }
  .counts b.up { color: var(--up); } .counts b.down { color: var(--down); }
  #grid { display: grid; gap: 8px; padding: 12px 16px 24px;
          grid-template-columns: var(--cols, repeat(auto-fill, minmax(var(--tile, 170px), 1fr))); }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
          padding: 8px 9px 6px; min-width: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .sym { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chg { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .rank { margin-right: auto; font-size: 11px; font-weight: 600; color: var(--muted);
          white-space: nowrap; opacity: 0; font-variant-numeric: tabular-nums; }
  .px { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
  canvas { display: block; width: 100%; height: var(--chart, 56px); margin-top: 4px; }
  #empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  .tile { cursor: pointer; position: relative; }
  .tile { transition: border-color 0.15s; }
  .tile:hover { border-color: color-mix(in srgb, var(--muted) 40%, var(--line)); }
  .tile:focus-visible { border-color: var(--accent); outline: none; }

  dialog { width: min(880px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0;
           border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
           color: var(--text); overflow: auto; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
  .d-body { padding: 16px 18px 18px; }
  .d-head { display: flex; align-items: flex-start; gap: 12px; }
  .d-sym { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .d-name, .d-sub { color: var(--muted); font-size: 12px; }
  .d-price { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; }
  .d-price #dPx { font-size: 20px; font-weight: 700; }
  #dClose { font: inherit; font-size: 20px; line-height: 1; width: 32px; height: 32px; flex: none;
            border: 1px solid var(--line); border-radius: 8px; background: transparent;
            color: var(--muted); cursor: pointer; }
  #dClose:hover { color: var(--text); border-color: var(--muted); }
  .d-chart { position: relative; margin-top: 12px; }
  #dCanvas { height: 300px; margin: 0; touch-action: pan-y; cursor: crosshair; }
  #dTip { position: absolute; top: 0; padding: 2px 8px; border-radius: 6px; font-size: 12px;
          background: var(--text); color: var(--panel); white-space: nowrap; pointer-events: none;
          font-variant-numeric: tabular-nums; }
  .d-title { margin: 14px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
             text-transform: uppercase; color: var(--muted); }
  .d-title span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .stats { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
           grid-auto-flow: dense; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
  .stat span { display: block; color: var(--muted); font-size: 11px; }
  .stat.wide { grid-column: span 2; }
  .stat b { display: block; font-variant-numeric: tabular-nums; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* a value never wraps, so a row never grows */
  .d-note { margin-top: 12px; color: var(--muted); font-size: 12px; }
  .d-note a { color: var(--accent); }
  @media (max-width: 560px) { #dCanvas { height: 220px; } .d-sym, .d-price #dPx { font-size: 17px; } }
</style>
</head>
<body>
<header>
  <h1>F&amp;O Board</h1>
  <div class="tabs" id="modes" role="tablist" aria-label="Live prices or archived days">
    <button role="tab" data-mode="live" aria-selected="true">Live</button>
    <button role="tab" data-mode="archive" aria-selected="false">Archive</button>
  </div>
  <select id="day" title="Archived day" hidden></select>
  <div class="tabs" id="groups" role="tablist">
    <button role="tab" data-tab="stocks" aria-selected="true">F&amp;O Stocks</button>
    <button role="tab" data-tab="indices" aria-selected="false">Indices</button>
  </div>
  <input id="q" type="search" placeholder="Filter" autocomplete="off">
  <select id="sort" title="Sort order">
    <option value="az">Default order</option>
    <option value="gain">Top gainers</option>
    <option value="loss">Top losers</option>
  </select>
  <select id="size" title="Chart size preset">
    <option value="130,44">Small</option>
    <option value="170,56" selected>Medium</option>
    <option value="260,96">Large</option>
  </select>
  <label title="Number of charts across the screen">Columns
    <input id="cols" class="num" type="number" min="1" max="40" placeholder="Auto"></label>
  <label title="Number of chart rows that fit on one screen">Rows
    <input id="rows" class="num" type="number" min="1" max="30" placeholder="Auto"></label>
  <span class="counts" id="counts"></span>
  <span class="spacer"></span>
  <span class="pill" id="status"><span class="dot"></span><span id="statusText">Connecting</span></span>
</header>
<div id="grid"></div>
<div id="empty" hidden></div>

<dialog id="detail" aria-labelledby="dSym">
  <div class="d-body">
    <div class="d-head">
      <div><div class="d-sym" id="dSym"></div><div class="d-name" id="dName"></div></div>
      <div class="d-price"><span id="dPx"></span> <span id="dChg" class="chg"></span>
        <div class="d-sub" id="dSub"></div></div>
      <button id="dClose" aria-label="Close">&times;</button>
    </div>
    <div class="d-chart"><canvas id="dCanvas"></canvas><div id="dTip" hidden></div></div>
    <div class="d-title" id="dDay">Today</div>
    <div class="stats" id="dToday"></div>
    <div id="dFnoWrap" hidden>
      <div class="d-title">Derivatives <span id="dFut"></span></div>
      <div class="stats" id="dFno"></div>
    </div>
    <div class="d-note" id="dNote" hidden></div>
    <div class="d-note" id="dFileWrap" hidden><a id="dFile">Download this day as JSON</a></div>
  </div>
</dialog>

<script>
const grid = document.getElementById('grid'), empty = document.getElementById('empty');
// sym -> {name, pts, el, canvas, chgEl, pxEl, pct}. `tiles` is whichever set is on screen.
const live = new Map(), arch = new Map();
let tiles = live, mode = 'live', archDay = null;
const dirty = new Set();
let css = getComputedStyle(document.documentElement);
const color = n => css.getPropertyValue(n).trim();

let tab = 'stocks';
try { tab = localStorage.getItem('fno-board-tab') === 'indices' ? 'indices' : 'stocks'; } catch (e) {}
const inTab = t => t.group === tab;

function makeTile(store, sym, name, pts, group, order, fut) {
  const el = document.createElement('div');
  el.className = 'tile'; el.title = name;
  el.innerHTML = '<div class="row"><span class="sym"></span><span class="rank"></span><span class="chg flat">--</span></div>' +
                 '<div class="px">--</div><canvas></canvas>';
  el.querySelector('.sym').textContent = sym;
  const t = { sym, name, pts, group, order, fut: !!fut, el, canvas: el.querySelector('canvas'),
              chgEl: el.querySelector('.chg'), pxEl: el.querySelector('.px'), pct: 0 };
  el.tabIndex = 0;
  el.addEventListener('click', () => openDetail(t));
  el.addEventListener('keydown', e => { if (e.key === 'Enter') openDetail(t); });
  store.set(sym, t);
  return t;
}

// The time axis covers the whole trading session (09:15 to 15:30 IST), so a chart fills in from the
// left as the day goes on. Points outside those hours (demo mode) fall back to their own time range.
function timeAxis(pts) {
  const a = pts[0][0], b = pts[pts.length - 1][0];
  const day = Math.floor((b + 19800) / 86400) * 86400 - 19800, open = day + 33300, close = day + 55800;
  if (a >= open - 900 && b <= close + 60) {
    const t0 = Math.min(a, open);
    return { t0, span: Math.max(b, close) - t0, session: true, open, close, partial: b < close - 60 };
  }
  return pts.length === 1 ? { t0: a - 30, span: 60 } : { t0: a, span: Math.max(b - a, 60) };
}

function draw(t) {
  const pts = t.pts, c = t.canvas;
  const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!w || !h) return;
  if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (!pts.length) { t.chgEl.textContent = '--'; t.pxEl.textContent = 'No data yet'; return; }

  const first = pts[0][1], last = pts[pts.length - 1][1];
  t.pct = first ? (last - first) / first * 100 : 0;
  const dir = t.pct > 0.005 ? 'up' : t.pct < -0.005 ? 'down' : 'flat';
  t.chgEl.className = 'chg ' + dir;
  t.chgEl.textContent = (t.pct > 0 ? '+' : '') + t.pct.toFixed(2) + '%';
  t.pxEl.textContent = (t.group === 'stocks' ? '₹' : '') + last.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let lo = Infinity, hi = -Infinity;
  for (const p of pts) { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; }
  if (hi === lo) { hi += 1; lo -= 1; }
  const ax = timeAxis(pts), pad = 3;
  const x = p => (p[0] - ax.t0) / ax.span * (w - 1) + 0.5;
  const y = p => pad + (hi - p) / (hi - lo) * (h - pad * 2);

  g.strokeStyle = color('--line'); g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(0, y(first)); g.lineTo(w, y(first)); g.stroke(); g.setLineDash([]);

  const stroke = color('--' + dir);
  g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(x(p), y(p[1])) : g.moveTo(x(p), y(p[1])));
  g.strokeStyle = stroke; g.lineWidth = 1.4; g.lineJoin = 'round'; g.stroke();
  g.lineTo(x(pts[pts.length - 1]), h); g.lineTo(x(pts[0]), h); g.closePath();
  g.globalAlpha = 0.10; g.fillStyle = stroke; g.fill(); g.globalAlpha = 1;
  if (ax.partial) {                                    // mark where the day has got to
    const e = pts[pts.length - 1];
    g.beginPath(); g.arc(Math.min(x(e), w - 2), y(e[1]), 2, 0, Math.PI * 2); g.fill();
  }
}

function flush() {
  for (const sym of dirty) { const t = tiles.get(sym); if (t) draw(t); }
  if (shown && dirty.has(shown.sym)) renderDetail();
  dirty.clear();
  updateCounts();
}
let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; flush(); }); }
function markAll() { for (const s of tiles.keys()) dirty.add(s); schedule(); }

function updateCounts() {
  let up = 0, down = 0, n = 0;
  for (const t of tiles.values()) {
    if (!inTab(t)) continue;
    n++;
    if (!t.pts.length) continue;
    if (t.pct > 0.005) up++; else if (t.pct < -0.005) down++;
  }
  document.getElementById('counts').innerHTML = n
    ? `${n} ${tab === 'stocks' ? 'companies' : 'indices'} · <b class="up">${up} up</b> · <b class="down">${down} down</b>` : '';
}

// layout('glide') is for a change of sort order: every tile glides from its old place to the
// new one. layout('nudge') is the periodic re-rank while prices are being watched: tiles take
// their new places at once with no movement. Tiles that came into view get a coloured ring,
// and the biggest movers already in view get a small rank marker.
const calm = matchMedia('(prefers-reduced-motion: reduce)');
function layout(how) {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const order = document.getElementById('sort').value;
  const list = [...tiles.values()].filter(t => inTab(t) &&
    (!q || t.sym.toLowerCase().includes(q) || t.name.toLowerCase().includes(q)));
  if (order === 'az') list.sort((a, b) => a.order - b.order);
  else list.sort((a, b) => order === 'gain' ? b.pct - a.pct : a.pct - b.pct);
  const kids = grid.children;
  if (how && list.length === kids.length && list.every((t, i) => t.el === kids[i])) return;
  const from = how && !calm.matches ? new Map([...kids].map((el, i) =>
    [el, { i, box: el.getBoundingClientRect() }])) : null;
  grid.replaceChildren(...list.map(t => t.el));
  empty.hidden = list.length > 0 || !tiles.size;
  if (!empty.hidden) empty.textContent = 'Nothing matches that filter.';
  applyGrid();
  if (from && how === 'glide') glideTiles(list, from, order);
  else if (from) nudgeTiles(list, from, order);
  for (const t of list) t.was = t.pct;
}

// After a periodic re-rank, mark what changed without moving anything:
//  - a tile that was off screen and is now in view gets a ring in the gain or loss colour;
//  - among tiles that were already in view, the biggest movers get a grey rank marker.
// "Moved" means outside the longest run of tiles that kept their order, so a tile that only
// shifted because another one passed it is not counted. Movers need 3 places or more, and at
// most 6 are marked, to keep the board calm.
function nudgeTiles(list, from, order) {
  const top = document.querySelector('header').getBoundingClientRect().bottom, vh = window.innerHeight;
  const inView = b => b.bottom - top > b.height / 2 && vh - b.top > b.height / 2;   // at least half showing
  const seq = [];                                   // [new index, old index, was in view]
  list.forEach((t, i) => { const o = from.get(t.el); if (o) seq.push([i, o.i, inView(o.box)]); });
  const tails = [], prev = new Array(seq.length).fill(-1);
  seq.forEach(([, old], k) => {
    let lo = 0, hi = tails.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (seq[tails[mid]][1] < old) lo = mid + 1; else hi = mid; }
    if (lo > 0) prev[k] = tails[lo - 1];
    tails[lo] = k;
  });
  const kept = new Set();
  for (let k = tails.length ? tails[tails.length - 1] : -1; k >= 0; k = prev[k]) kept.add(k);

  const mark = ([now, old], tint) => {
    const t = list[now], badge = t.el.querySelector('.rank');
    badge.textContent = now === old ? '' : (now < old ? '▲' : '▼') + Math.abs(now - old);
    badge.style.color = tint || '';
    for (const a of badge.getAnimations()) a.cancel();
    badge.animate([{ opacity: 0 }, { opacity: 1, offset: 0.08 }, { opacity: 1, offset: 0.8 }, { opacity: 0 }],
      { duration: 6000 });
    if (tint) t.el.animate([
      { boxShadow: `0 0 0 2px ${tint}, 0 0 20px -6px ${tint}` },
      { boxShadow: `0 0 0 2px ${tint}, 0 0 20px -6px ${tint}`, offset: 0.45 },
      { boxShadow: '0 0 0 0 transparent' }], { duration: 3200, easing: 'ease-out' });
    else t.el.animate([{ borderColor: color('--muted') }, { borderColor: color('--line') }],
      { duration: 2500, easing: 'ease-out' });
  };
  const ring = color(order === 'loss' ? '--down' : '--up'), movers = [];
  seq.forEach((m, k) => {
    const seen = inView(list[m[0]].el.getBoundingClientRect());
    if (seen && !m[2]) mark(m, ring);                               // new to the view
    else if (seen && !kept.has(k) && Math.abs(m[0] - m[1]) >= 3) movers.push(m);
  });
  movers.sort((a, b) => Math.abs(b[0] - b[1]) - Math.abs(a[0] - a[1])).slice(0, 6).forEach(m => mark(m));
}

function glideTiles(list, from, order) {
  const vh = window.innerHeight, ring = color(order === 'loss' ? '--down' : '--up');
  list.forEach((t, i) => {
    const old = from.get(t.el);
    if (!old) return;
    const a = old.box, b = t.el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (!dx && !dy) return;
    if ((a.bottom < 0 || a.top > vh) && (b.bottom < 0 || b.top > vh)) return;   // never on screen
    const climbed = order !== 'az' && i < old.i && t.was != null &&
      (order === 'gain' ? t.pct > t.was : t.pct < t.was);
    t.el.style.zIndex = climbed ? 2 : 1;
    const move = t.el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
      { duration: 560, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' });
    move.onfinish = move.oncancel = () => { t.el.style.zIndex = ''; };
    if (climbed) t.el.animate([
      { boxShadow: `0 0 0 0 transparent` },
      { boxShadow: `0 0 0 1.5px ${ring}, 0 8px 22px -10px ${ring}`, offset: 0.25 },
      { boxShadow: `0 0 0 0 transparent` }], { duration: 1500, easing: 'ease-out' });
  });
}

// Size preset = quick Small/Medium/Large. Columns and Rows fine-tune on top of it:
// Columns = charts across; Rows = chart rows that fit in one screen height.
// The choice is remembered separately for each screen size.
const sizeIn = document.getElementById('size');
const colsIn = document.getElementById('cols'), rowsIn = document.getElementById('rows');
const viewKey = () => `fno-board-view-${tab}-${screen.width}x${screen.height}`;
function applyGrid() {
  const cols = parseInt(colsIn.value), rows = parseInt(rowsIn.value);
  const root = document.documentElement.style;
  const [tileW, chartH] = sizeIn.value.split(',');
  root.setProperty('--tile', tileW + 'px');
  if (cols > 0) root.setProperty('--cols', `repeat(${cols}, minmax(0, 1fr))`);
  else root.removeProperty('--cols');
  const first = grid.firstElementChild;
  if (rows > 0 && first) {
    const chrome = first.offsetHeight - first.querySelector('canvas').clientHeight;
    const gs = getComputedStyle(grid);
    const avail = window.innerHeight - document.querySelector('header').offsetHeight
      - parseFloat(gs.paddingTop) - parseFloat(gs.paddingBottom) - (rows - 1) * parseFloat(gs.rowGap);
    root.setProperty('--chart', Math.max(14, Math.floor(avail / rows - chrome)) + 'px');
  } else if (!(rows > 0)) root.setProperty('--chart', chartH + 'px');
  markAll();
}
function saveView() {
  try { localStorage.setItem(viewKey(), JSON.stringify({ size: sizeIn.value, cols: colsIn.value, rows: rowsIn.value })); } catch (e) {}
}
function loadView() {
  let v = {};
  try { v = JSON.parse(localStorage.getItem(viewKey())) || {}; } catch (e) {}
  colsIn.value = v.cols || ''; rowsIn.value = v.rows || '';
  sizeIn.value = v.size && [...sizeIn.options].some(o => o.value === v.size) ? v.size : '170,56';
}

function setStatus(st, offline) {
  const pill = document.getElementById('status'), text = document.getElementById('statusText');
  if (offline) { pill.className = 'pill offline'; text.textContent = 'Disconnected, retrying'; return; }
  pill.className = 'pill ' + st.state;
  const label = { live: 'Live · Groww', demo: 'Demo data', starting: 'Starting', error: 'Error' }[st.state] || st.state;
  text.textContent = st.detail ? label + ' · ' + st.detail : label;
  if (mode === 'live' && !live.size) {
    empty.hidden = false;
    empty.textContent = st.state === 'error' ? 'Could not load data: ' + st.detail : 'Loading companies…';
  }
}

// ------------------------------------------------------------- detail modal
const dlg = document.getElementById('detail'), big = document.getElementById('dCanvas');
const tip = document.getElementById('dTip'), $ = id => document.getElementById(id);
let shown = null, info = null, hoverX = null, infoTimer = 0;

const num = (v, d = 2) => v == null || isNaN(v) ? '—'
  : Number(v).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
const signed = (v, d = 2) => v == null || isNaN(v) ? '—' : (v > 0 ? '+' : '') + num(v, d);
const dirOf = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const clock = ts => new Date(ts * 1000).toLocaleTimeString('en-IN',
  { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Kolkata' });
const stat = (label, value, cls, wide) =>
  `<div class="stat${wide ? ' wide' : ''}"><span>${label}</span><b class="${cls || ''}">${value}</b></div>`;

function openDetail(t) {
  shown = t; info = null; hoverX = null;
  $('dSym').textContent = t.sym; $('dName').textContent = t.name;
  if (!dlg.open) dlg.showModal();
  renderDetail(); loadInfo();
  clearInterval(infoTimer);
  if (mode === 'live') infoTimer = setInterval(loadInfo, 5000);
}
function loadInfo() {
  if (!shown) return;
  const sym = shown.sym, day = mode === 'archive' ? archDay : null;
  const url = day ? `/archive/${day}/${encodeURIComponent(sym)}.json` : '/api/detail/' + encodeURIComponent(sym);
  fetch(url).then(r => r.json()).then(d => {
    if (!shown || shown.sym !== sym || d.error || (day && (mode !== 'archive' || archDay !== day))) return;
    info = !day ? d : {                       // an archived day: figures come from its saved file
      file: url, fileName: `${sym}-${day}.json`,
      quote: { open: d.open, high: d.high, low: d.low, prevClose: d.prevClose, volume: d.volume },
      fut: d.fut && d.fut.close != null ? { last: d.fut.close, oi: d.fut.oi, volume: d.fut.volume,
        oiChangePct: d.fut.oi != null && d.fut.prevOi ? (d.fut.oi - d.fut.prevOi) / d.fut.prevOi * 100 : null } : null,
      futSymbol: d.fut && d.fut.symbol, lot: d.fut && d.fut.lot, expiry: d.fut && d.fut.expiry };
    renderDetail();
  }).catch(() => {});
}

function renderDetail() {
  const t = shown, pts = t.pts, cur = t.group === 'stocks' ? '₹' : '';
  const q = info && info.quote, f = info && info.fut, old = mode === 'archive';
  let open = null, hi = null, lo = null, last = null;
  if (pts.length) {
    open = pts[0][1]; last = pts[pts.length - 1][1]; hi = -Infinity; lo = Infinity;
    for (const p of pts) { if (p[1] > hi) hi = p[1]; if (p[1] < lo) lo = p[1]; }
  }
  if (q && q.high != null) { open = q.open; hi = q.high; lo = q.low; }   // archived day's own figures
  const prev = q && q.prevClose != null ? q.prevClose : null;
  const base = prev != null ? prev : open;
  const chg = last != null && base ? last - base : null;
  $('dPx').textContent = last != null ? cur + num(last) : '—';
  $('dChg').className = 'chg ' + dirOf(chg);
  $('dChg').textContent = chg != null ? `${signed(chg)} (${signed(chg / base * 100)}%)` : '';
  $('dSub').textContent = chg == null ? 'No data yet'
    : prev != null ? 'vs previous close' : old ? "since the day's first price" : "since today's first price";

  $('dDay').textContent = old ? dayLabel(archDay) : 'Today';
  $('dToday').innerHTML = stat('Open', num(open)) + stat('High', num(hi)) + stat('Low', num(lo)) +
    stat(old ? 'Close' : 'Previous close', num(old ? last : prev)) +
    (old ? stat('Previous close', num(prev)) : '') +
    (t.group === 'stocks' ? stat('Volume', q ? num(q.volume, 0) : '—') : '') +
    (old ? '' : stat('52-week high', q ? num(q.high52) : '—') + stat('52-week low', q ? num(q.low52) : '—'));

  // Until the detail loads, the tile's own flag reserves the section so the modal doesn't grow.
  const hasFut = info ? !!info.futSymbol : t.fut;
  $('dFnoWrap').hidden = !hasFut;
  if (hasFut) {
    const prem = f && f.last != null && last != null ? f.last - last : null;
    $('dFut').textContent = info ? '· ' + info.futSymbol : '';
    $('dFno').innerHTML = stat(old ? 'Futures close' : 'Futures price', f ? num(f.last) : '—') +
      stat('Premium to spot', prem != null ? `${signed(prem)} (${signed(prem / last * 100)}%)` : '—', dirOf(prem), true) +
      (old ? stat('Futures volume', f ? num(f.volume, 0) : '—') : '') +
      stat('Open interest', f ? num(f.oi, 0) : '—') +
      stat(old ? 'OI change on the day' : 'OI change today',
           f && f.oiChangePct != null ? signed(f.oiChangePct) + '%' : '—', f ? dirOf(f.oiChangePct) : '') +
      stat('Lot size', info ? num(info.lot, 0) : '—') +
      stat('Expiry', info ? new Date(info.expiry + 'T00:00:00').toLocaleDateString('en-IN',
           { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
  }
  const missing = info && !q;
  $('dFileWrap').hidden = !old;               // the day's file is known up front, so the link never pops in
  if (old) { $('dFile').href = `/archive/${archDay}/${encodeURIComponent(t.sym)}.json`;
             $('dFile').download = `${t.sym}-${archDay}.json`; }
  $('dNote').hidden = !missing;
  if (missing) $('dNote').textContent = 'Previous close, volume, 52-week range, futures price and ' +
    'open interest need market-data access on your Groww Trade API account.';
  drawBig(prev, chg);
}

function drawBig(prev, chg) {
  const pts = shown.pts, w = big.clientWidth, h = big.clientHeight, dpr = window.devicePixelRatio || 1;
  if (!w || !h) return;
  big.width = Math.round(w * dpr); big.height = Math.round(h * dpr);
  const g = big.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  tip.hidden = true;
  if (!pts.length) return;
  const m = { l: 6, r: 62, t: 22, b: 22 }, pw = w - m.l - m.r, ph = h - m.t - m.b;
  let lo = Infinity, hi = -Infinity;
  for (const p of pts) { if (p[1] < lo) lo = p[1]; if (p[1] > hi) hi = p[1]; }
  if (prev != null) { lo = Math.min(lo, prev); hi = Math.max(hi, prev); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const padY = (hi - lo) * 0.06; lo -= padY; hi += padY;
  const ax = timeAxis(pts), t0 = ax.t0, span = ax.span;
  const x = ts => m.l + (ts - t0) / span * pw;
  const y = v => m.t + (hi - v) / (hi - lo) * ph;

  g.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  g.textBaseline = 'middle'; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {                       // price grid
    const v = lo + (hi - lo) * i / 4, yy = Math.round(y(v)) + 0.5;
    g.strokeStyle = color('--line'); g.beginPath(); g.moveTo(m.l, yy); g.lineTo(m.l + pw, yy); g.stroke();
    g.fillStyle = color('--muted'); g.textAlign = 'left'; g.fillText(num(v), m.l + pw + 6, yy);
  }
  const ty = h - m.b / 2;                              // time labels
  if (ax.session) {                                    // session start and end, whole hours between
    g.textAlign = 'left'; g.fillText(clock(t0), m.l, ty);
    g.textAlign = 'right'; g.fillText(clock(t0 + span), m.l + pw, ty);
    g.textAlign = 'center';
    const step = pw / (span / 3600) >= 70 ? 1 : 2;
    for (let hr = 10; hr <= 15; hr += step) {
      const ts = ax.open - 900 + (hr - 9) * 3600, xx = x(ts);
      if (xx > m.l + 50 && xx < m.l + pw - 50) g.fillText(clock(ts), xx, ty);
    }
  } else {
    const labels = Math.max(2, Math.min(6, Math.floor(pw / 90)));
    for (let i = 0; i <= labels; i++) {
      const ts = t0 + span * i / labels;
      g.textAlign = i === 0 ? 'left' : i === labels ? 'right' : 'center';
      g.fillText(clock(ts), x(ts), ty);
    }
  }
  if (prev != null) {                                  // previous close
    g.strokeStyle = color('--muted'); g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(m.l, y(prev)); g.lineTo(m.l + pw, y(prev)); g.stroke(); g.setLineDash([]);
    g.textAlign = 'left'; g.fillText('Prev close', m.l + 4, y(prev) - 8);
  }
  const stroke = color('--' + dirOf(chg));
  g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(x(p[0]), y(p[1])) : g.moveTo(x(p[0]), y(p[1])));
  g.strokeStyle = stroke; g.lineWidth = 1.8; g.lineJoin = 'round'; g.stroke();
  g.lineTo(x(pts[pts.length - 1][0]), m.t + ph); g.lineTo(x(pts[0][0]), m.t + ph); g.closePath();
  g.globalAlpha = 0.10; g.fillStyle = stroke; g.fill(); g.globalAlpha = 1;
  if (ax.partial) {                                    // mark where the day has got to
    const e = pts[pts.length - 1];
    g.beginPath(); g.arc(x(e[0]), y(e[1]), 3, 0, Math.PI * 2); g.fill();
  }

  if (hoverX != null) {                                // crosshair on the nearest minute
    let best = pts[0];
    for (const p of pts) if (Math.abs(x(p[0]) - hoverX) < Math.abs(x(best[0]) - hoverX)) best = p;
    const hx = x(best[0]), hy = y(best[1]);
    g.strokeStyle = color('--muted'); g.lineWidth = 1;
    g.beginPath(); g.moveTo(hx, m.t); g.lineTo(hx, m.t + ph); g.stroke();
    g.fillStyle = stroke; g.beginPath(); g.arc(hx, hy, 4, 0, Math.PI * 2); g.fill();
    tip.hidden = false;
    tip.textContent = `${clock(best[0])} · ${shown.group === 'stocks' ? '₹' : ''}${num(best[1])}`;
    tip.style.left = Math.max(0, Math.min(w - tip.offsetWidth, hx - tip.offsetWidth / 2)) + 'px';
  }
}

big.addEventListener('pointermove', e => { hoverX = e.offsetX; if (shown) renderDetail(); });
big.addEventListener('pointerleave', () => { hoverX = null; if (shown) renderDetail(); });
$('dClose').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });   // click on backdrop
dlg.addEventListener('close', () => { shown = null; clearInterval(infoTimer); });
window.addEventListener('resize', () => { if (shown) renderDetail(); });

// ------------------------------------------------------------------ archive
// Finished days are saved by the server as one JSON file per instrument. Archive mode
// shows a saved day in the same grid; the tabs, filter, sort and sizes work as in Live.
const dayIn = $('day');
const dayLabel = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN',
  { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
function say(text) { empty.hidden = false; empty.textContent = text; }

function setMode(next) {
  mode = next;
  for (const b of document.querySelectorAll('#modes button'))
    b.setAttribute('aria-selected', b.dataset.mode === mode);
  if (dlg.open) dlg.close();
  dayIn.hidden = mode !== 'archive';
  dirty.clear();
  if (mode === 'live') {
    tiles = live; layout();
    if (!live.size) say('Loading companies…');
    return;
  }
  tiles = arch; arch.clear(); layout();
  say('Loading archive…');
  fetch('/api/archive').then(r => r.json()).then(d => {
    if (mode !== 'archive') return;
    dayIn.replaceChildren(...d.days.map(x => new Option(dayLabel(x), x)));
    if (!d.days.length) {
      dayIn.hidden = true;
      return say('No days archived yet. Each trading day is saved shortly after the market closes, ' +
                 'at 4:05 pm IST, while the board is running.');
    }
    if (d.days.includes(archDay)) dayIn.value = archDay;
    loadDay(dayIn.value);
  }).catch(() => { if (mode === 'archive') say('Could not load the archive.'); });
}

function loadDay(day) {
  archDay = day;
  if (dlg.open) dlg.close();
  fetch('/api/archive/' + day).then(r => r.json()).then(d => {
    if (mode !== 'archive' || archDay !== day) return;
    arch.clear();
    (d.symbols || []).forEach((s, i) => makeTile(arch, s.s, s.n, s.p, s.g, i, s.f));
    layout();
    if (!arch.size) say('Nothing was saved for this day.');
  }).catch(() => { if (mode === 'archive' && archDay === day) say('Could not load that day.'); });
}
for (const b of document.querySelectorAll('#modes button'))
  b.addEventListener('click', () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode); });
dayIn.addEventListener('change', () => loadDay(dayIn.value));

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'snapshot') {
      live.clear();
      m.symbols.forEach((s, i) => makeTile(live, s.s, s.n, s.p, s.g || 'stocks', i, s.f));
      setStatus(m.status);
      if (mode === 'live') {
        if (shown) { shown = live.get(shown.sym) || null; if (shown) renderDetail(); else dlg.close(); }
        layout();
      }
      if (!m.symbols.length) setTimeout(() => ws.close(), 2000);   // still loading: reconnect
      return;
    }
    setStatus(m.status);
    const seen = sym => { if (mode === 'live') dirty.add(sym); };   // an archived day stays as saved
    for (const sym in m.hist) { const t = live.get(sym); if (t) { t.pts = m.hist[sym]; seen(sym); } }
    for (const sym in m.ticks) {
      const t = live.get(sym); if (!t) continue;
      const [ts, price] = m.ticks[sym], last = t.pts[t.pts.length - 1];
      if (last && last[0] === ts) last[1] = price; else t.pts.push([ts, price]);
      seen(sym);
    }
    schedule();
  };
  ws.onclose = () => { setStatus(null, true); setTimeout(connect, 1500); };
}

function setTab(next) {
  tab = next;
  try { localStorage.setItem('fno-board-tab', tab); } catch (e) {}
  for (const b of document.querySelectorAll('#groups button'))
    b.setAttribute('aria-selected', b.dataset.tab === tab);
  loadView();          // each tab keeps its own size, columns and rows
  layout();
}
for (const b of document.querySelectorAll('#groups button'))
  b.addEventListener('click', () => setTab(b.dataset.tab));
document.getElementById('q').addEventListener('input', () => layout());
document.getElementById('sort').addEventListener('change', () => layout('glide'));
for (const el of [colsIn, rowsIn]) el.addEventListener('input', () => { saveView(); applyGrid(); });
sizeIn.addEventListener('change', () => {       // picking a preset returns to automatic fit
  colsIn.value = ''; rowsIn.value = ''; saveView(); applyGrid();
});
loadView();
setInterval(() => { if (document.getElementById('sort').value !== 'az') layout('nudge'); }, 15000);
let lastScreen = viewKey();
window.addEventListener('resize', () => {
  if (viewKey() !== lastScreen) { lastScreen = viewKey(); loadView(); }   // moved to another screen
  applyGrid();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  css = getComputedStyle(document.documentElement); markAll();
});
for (const b of document.querySelectorAll('#groups button'))
  b.setAttribute('aria-selected', b.dataset.tab === tab);
connect();
</script>
</body>
</html>
